name: Sync with upstream Vesktop

# Keeps Vesktop-Canary on the newest upstream Vesktop automatically.
# Runs daily; if upstream main merges cleanly the result is pushed straight to
# main (CI on main then verifies it). If there are conflicts, a PR is opened
# instead so a human can resolve them.

on:
    schedule:
        - cron: "17 4 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: sync-upstream
    cancel-in-progress: false

env:
    UPSTREAM_REPO: https://github.com/Vencord/Vesktop.git
    UPSTREAM_BRANCH: main

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Fetch upstream
              run: git fetch "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"

            - name: Check for new upstream commits
              id: check
              run: |
                  behind=$(git rev-list --count HEAD..FETCH_HEAD)
                  echo "behind=$behind" >> "$GITHUB_OUTPUT"
                  echo "Behind upstream by $behind commit(s)"

            - name: Try clean merge
              if: steps.check.outputs.behind != '0'
              id: merge
              run: |
                  set +e
                  git merge --no-edit -m "chore: sync with upstream Vesktop $(git rev-parse --short FETCH_HEAD)" FETCH_HEAD
                  status=$?
                  set -e
                  if [ $status -eq 0 ]; then
                      echo "clean=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "clean=false" >> "$GITHUB_OUTPUT"
                      git merge --abort
                  fi

            - name: Keep Canary package name
              if: steps.merge.outputs.clean == 'true'
              run: |
                  # upstream owns everything in package.json except the name; re-assert it
                  sed -i 's/"name": "vesktop",/"name": "vesktop-canary",/' package.json
                  if ! git diff --quiet; then
                      git commit -am "chore: re-apply Canary package name after upstream sync"
                  fi

            - uses: pnpm/action-setup@v4
              if: steps.merge.outputs.clean == 'true'

            - uses: actions/setup-node@v5
              if: steps.merge.outputs.clean == 'true'
              with:
                  node-version: 22
                  cache: pnpm

            - name: Verify merged tree builds
              if: steps.merge.outputs.clean == 'true'
              id: verify
              run: |
                  set +e
                  pnpm install --frozen-lockfile && pnpm test && pnpm build
                  echo "ok=$?" >> "$GITHUB_OUTPUT"

            - name: Push merge
              if: steps.merge.outputs.clean == 'true' && steps.verify.outputs.ok == '0'
              run: git push origin HEAD:${{ github.ref_name }}

            - name: Open PR on conflict or failed verification
              if: steps.check.outputs.behind != '0' && (steps.merge.outputs.clean != 'true' || steps.verify.outputs.ok != '0')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git checkout -B sync/upstream ${{ github.sha }}
                  git merge FETCH_HEAD || true
                  # commit with conflict markers so the PR shows exactly what needs resolving
                  git add -A
                  git -c core.editor=true commit -q -m "chore: sync with upstream Vesktop (needs manual resolution)" || true
                  git push -f origin sync/upstream
                  if ! gh pr list --head sync/upstream --json number --jq '.[0].number' | grep -q .; then
                      gh pr create --base ${{ github.ref_name }} --head sync/upstream \
                        --title "Sync with upstream Vesktop" \
                        --body "Automatic upstream merge could not be applied cleanly (conflicts or failed build). Resolve and merge manually."
                  fi
